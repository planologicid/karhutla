<style>
:root{
  --void:#0a0e13;
  --panel:#101720;
  --panel-alt:#151f2a;
  --panel-raised:#1a2530;
  --hair:#22323f;
  --hair-soft:#1a2732;
  --text:#e6eef4;
  --text-dim:#8ea2b3;
  --text-faint:#5a7080;
  --amber:#f2a93b;
  --amber-dim:#8a6526;
  --red:#ef4136;
  --font-display:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(79,209,232,0.06), transparent 42%),
    radial-gradient(circle at 85% 85%, rgba(239,65,54,0.06), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(242,169,59,0.05), transparent 40%);
  position:relative;
  overflow:hidden;
}
/* subtle scanning grid backdrop */
body::before{
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:42px 42px;
  pointer-events:none;
  mask-image:radial-gradient(circle at 50% 40%, black 0%, transparent 70%);
}

.card{
  position:relative;
  width:100%;
  max-width:400px;
  background:linear-gradient(160deg, var(--panel-raised), var(--panel));
  border:1px solid var(--hair);
  border-radius:16px;
  padding:38px 32px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--amber), transparent);
  opacity:0.7;
}

.logo-row{display:flex;justify-content:center;margin-bottom:22px;}
.logo-row img{height:46px;width:auto;}

.radar{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--amber-dim);
  position:relative;
  margin:0 auto 16px;
  background:radial-gradient(circle at center, rgba(242,169,59,0.1), transparent 70%);
}
.radar::before{
  content:'';
  position:absolute;inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg, rgba(242,169,59,0.9), transparent 35%);
  animation:sweep 2.4s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 0,transparent 2px,black 2px);
  mask:radial-gradient(circle,transparent 0,transparent 2px,black 2px);
}
.radar::after{
  content:'';
  position:absolute;top:50%;left:50%;width:3px;height:3px;
  background:var(--amber);border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px 1px var(--amber);
}
@keyframes sweep{to{transform:rotate(360deg);}}

h1{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  text-align:center;
  line-height:1.35;
  margin-bottom:6px;
}
.subtitle{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-faint);
  text-align:center;
  margin-bottom:28px;
}

.field{margin-bottom:17px;}
.field label{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:7px;
}
.input-wrap{position:relative;}
.input-wrap > svg.field-icon{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color:var(--text-faint); pointer-events:none;
  transition:color .15s;
}
.input-wrap:focus-within > svg.field-icon{color:var(--amber);}
.field input{
  width:100%;
  background:var(--void);
  border:1px solid var(--hair);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13.5px;
  padding:12px 12px 12px 40px;
  border-radius:9px;
  transition:border-color .15s, box-shadow .15s;
}
.field input::placeholder{color:var(--text-faint);}
.field input:focus{outline:none;border-color:var(--amber-dim);box-shadow:0 0 0 3px rgba(242,169,59,0.12);}
#password{padding-right:42px;}
.toggle-pw{
  position:absolute; right:5px; top:50%; transform:translateY(-50%);
  width:32px;height:32px;
  background:none;border:none;color:var(--text-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  transition:color .15s, background .15s;
}
.toggle-pw svg{display:block;pointer-events:none;}
.toggle-pw:hover{color:var(--text-dim);background:rgba(255,255,255,0.05);}

.row-between{
  display:flex;align-items:center;justify-content:space-between;
  margin:4px 0 22px;
}
.remember{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--text-dim);cursor:pointer;
}
.remember input{accent-color:var(--amber);width:14px;height:14px;cursor:pointer;}
.forgot-link{
  font-size:12px;color:var(--cyan,#4fd1e8);text-decoration:none;
}
.forgot-link:hover{text-decoration:underline;}

.btn-login{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg, var(--amber), #d98f22);
  color:#1a1200;
  border:none;
  font-family:var(--font-body);
  font-size:14px;font-weight:700;
  padding:12px;border-radius:9px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(242,169,59,0.25);
  transition:transform .12s, box-shadow .12s;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(242,169,59,0.35);}
.btn-login:active{transform:translateY(0);}
.btn-login:disabled{opacity:0.7;cursor:wait;transform:none;}

.error-msg{
  display:none;
  align-items:center;gap:8px;
  background:rgba(239,65,54,0.08);
  border:1px solid rgba(239,65,54,0.3);
  color:var(--red);
  font-size:12px;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:16px;
}
.error-msg.show{display:flex;}

.info-msg{
  display:none;
  align-items:center;gap:8px;
  background:rgba(79,209,232,0.08);
  border:1px solid rgba(79,209,232,0.3);
  color:#4fd1e8;
  font-size:12px;
  padding:9px 12px;
  border-radius:8px;
  margin-top:14px;
}
.info-msg.show{display:flex;}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0 16px;
  color:var(--text-faint);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:var(--hair);
}

.btn-sso{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel-alt);
  border:1px solid var(--hair);
  color:var(--text-dim);
  font-family:var(--font-body);
  font-size:13px;font-weight:600;
  padding:11px;border-radius:9px;
  cursor:pointer;
  transition:border-color .15s, color .15s;
}
.btn-sso:hover{border-color:var(--cyan-dim,#245e69);color:#4fd1e8;}

.aux-links{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:18px;
  font-size:12px;
}
.aux-links a{color:var(--amber);text-decoration:none;}
.aux-links a:hover{text-decoration:underline;}
.aux-links .sep{color:var(--text-faint);}

.demo-hint{
  margin-top:20px;
  padding:11px 13px;
  background:var(--panel-alt);
  border:1px solid var(--hair-soft);
  border-radius:9px;
  font-size:11px;
  color:var(--text-faint);
  line-height:1.6;
}
.demo-hint b{color:var(--text-dim);}

.footer-note{
  text-align:center;
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-faint);
  letter-spacing:0.04em;
  margin-top:24px;
}
</style>

  hideError();
  infoText.textContent = msg;
  infoMsg.classList.add('show');
}
function hideInfo(){
  infoMsg.classList.remove('show');
}

function waLink(){
  const namaIsian = usernameEl.value.trim() || '___';
  const pesan = `Hai saya ${namaIsian}, mau buat akun akses dashboard`;
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(pesan)}`;
}

document.getElementById('forgotLink').addEventListener('click', (e)=>{
  e.preventDefault();
  window.open(waLink(), '_blank', 'noopener');
});
document.getElementById('createAccountLink').addEventListener('click', (e)=>{
  e.preventDefault();
  window.open(waLink(), '_blank', 'noopener');
});

document.getElementById('btnSso').addEventListener('click', ()=>{
  showInfo('SSO Bappenas saat ini belum tersedia. Silakan masuk menggunakan nama pengguna dan kata sandi.');
});

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  hideError();
  hideInfo();
  const unameRaw = usernameEl.value.trim();
  const uname = unameRaw.toLowerCase();
  const pwd = passwordEl.value;

  if(!unameRaw || !pwd){
    showError('Nama pengguna dan kata sandi wajib diisi.');
    return;
  }

  const account = ACCOUNTS[uname];
  if(!account || account.pass !== pwd){
    showError('Nama pengguna atau kata sandi salah.');
    return;
  }

  btnSubmit.disabled = true;
  btnSubmitLabel.textContent = 'Memproses...';

  const remember = document.getElementById('remember').checked;
  try {
    if(remember){ localStorage.setItem('hotspotDashboardUsername', unameRaw); }
    else { localStorage.removeItem('hotspotDashboardUsername'); }
  } catch(err){}

  try {
    sessionStorage.setItem('hotspotDashboardUser', account.nama);
  } catch(err){}

  setTimeout(()=>{
    window.location.href = 'dashboard-peta-hotspot-indonesia.html';
  }, 350);
});
</script>
</body>
</html>
